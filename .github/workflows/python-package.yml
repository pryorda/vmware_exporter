# Lint and test every pull request; publish to PyPI from main via semantic-release.

name: Python Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . -r requirements-tests.txt
    - name: Lint with flake8
      run: flake8 vmware_exporter tests --statistics
    - name: Lint dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning
    - name: Unit tests
      run: pytest --cov=vmware_exporter --cov-report=term -v tests/unit
    - name: Integration tests
      if: matrix.python-version == '3.12'
      run: pytest -v tests/integration

  deploy:
    strategy:
      matrix:
        python-version: ["3.12"]

    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: install semantic-release
      run: |
        pip install python-semantic-release
    - name: deploy pip
      run: |
        git config --global user.name "semantic-release (via github actions)"
        git config --global user.email "semantic-release@github-actions"
        semantic-release publish
      env: # Or as an environment variable
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        PYPI_TOKEN:  ${{ secrets.PYPI_TOKEN }}
